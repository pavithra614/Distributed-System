version: '3'
services:
  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"
    environment:
      - JWT_SECRET=your_jwt_secret
  poll-service:
    build: ./poll-service
    ports:
      - "5002:5002"
  vote-service:
    build: ./vote-service
    ports:
      - "5003:5003"
  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voting_db
    ports:
      - "3306:3306"
